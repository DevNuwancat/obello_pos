# This is a GitHub Actions "workflow" — a robot that runs on GitHub's own
# computers. This one spins up a real Windows machine, installs Python,
# installs our print-agent's dependencies, and packages app.py into a single
# ObelloPrintAgent.exe file using PyInstaller. You never need your own
# Windows PC for this.
#
# How to run it:
#   1. Push this file (and the print-agent folder) to GitHub.
#   2. Go to your repo on github.com -> "Actions" tab -> "Build Print Agent (Windows)"
#      -> "Run workflow" button.
#   3. Wait ~2 minutes, then open the finished run and download the
#      "ObelloPrintAgent-windows" zip from the "Artifacts" section at the bottom.
#   4. Unzip it and send ObelloPrintAgent.exe to your client.
name: Build Print Agent (Windows)

on:
  # Lets you click a "Run workflow" button on GitHub whenever you want a new .exe
  workflow_dispatch:
  # Also auto-builds whenever print-agent code changes on main, so the .exe
  # never goes stale
  push:
    branches: [main]
    paths:
      - 'print-agent/**'
      - '.github/workflows/build-print-agent.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-agent
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build ObelloPrintAgent.exe
        run: pyinstaller print_agent.spec

      - name: Upload the built exe
        uses: actions/upload-artifact@v4
        with:
          name: ObelloPrintAgent-windows
          path: print-agent/dist/ObelloPrintAgent.exe
