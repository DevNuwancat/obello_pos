  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<script type="module">

// ═══════════════════════════════════════════════════════
//  SUPABASE CONFIG
// ═══════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON = 'YOUR_ANON_KEY';

const sb = {
  h: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
  async get(table, q='') {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*&order=created_at.desc${q}`, { headers: this.h });
    if (!r.ok) throw new Error(await r.text()); return r.json();
  },
  async post(table, body) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method:'POST', headers: this.h, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text()); return r.json();
  },
  async patch(table, id, body) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method:'PATCH', headers: this.h, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
  },
  async del(table, id) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method:'DELETE', headers: this.h });
    if (!r.ok) throw new Error(await r.text());
  },
};

// ═══════════════════════════════════════════════════════
//  THEMES — exact Obello tokens
// ═══════════════════════════════════════════════════════

  accentBg:'#141412', accentText:'#F7F5F2', activeNav:'#141412', activeNavTxt:'#F7F5F2',
  shadow:'0 1px 6px rgba(0,0,0,0.07)', shadowLg:'0 16px 60px rgba(0,0,0,0.14)',

  success:'#16a34a', successBg:'rgba(22,163,74,0.1)',

// ═══════════════════════════════════════════════════════

function ico(name, size=16, sw=1.5, color='currentColor') {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let S = {
  mode: 'light',
  // View modal (categories)
  viewModal: null,      // 'categories' | null
  viewRows: [],
  viewLoading: false,
  viewSearch: '',
  viewSort: 'date',     // 'date' | 'type'
  // Add modal
  addModal: null,       // 'categories' | 'cloths' | 'supplier' | 'accessories'
  // Category form
  catForm: { name:'', code:'', category:'' },
  catErrors: {},
  catSaving: false,
  catSaved: false,
  // Product form
  prodForm: { category:'', size:'', name:'', cost:'', discount:'', labelPrice:'', stock:'', barcode:'', lotNo:'', designNo:'', color:'', supplier:'', owner:'Obello (O)' },
  prodErrors: {},
  prodSaving: false,
  prodSaved: false,
  prodImagePreview: null,
  // Hover
  hovered: null,
  // Delete confirm in view modal
  confirmDelete: null,
  dbError: null,
};

const SIZES = ['XS','S','M','L','XL','XXL','XXXL','Free Size'];
const SUPPLIERS = ['Posh Mart (P)', 'Ahmed Fabrics (A)', 'Karachi Textiles (K)', 'Faisal Cloth (F)'];
const OWNERS = ['Obello (O)', 'Shashika (S)', 'Admin (A)'];

function T() { return S.mode === 'dark' ? DARK : LIGHT; }
function setState(patch) { Object.assign(S, typeof patch==='function' ? patch(S) : patch); render(); }

// ─── SKU auto-generator
function genSKU() {
  const f = S.prodForm;
  const catCode = (f.category || 'XX').substring(0,3).toUpperCase().replace(/[^A-Z]/g,'X');
  const sup = (f.supplier||'XX')[0].toUpperCase()||'X';
  const lot = f.lotNo || '00';
  const des = f.designNo || '000';
  const sz  = (f.size || 'X').substring(0,2);
  return `${sup}P/${lot}/${des}/${catCode}/${sz}`;
}

// ─── DB operations
async function loadCategoryView() {
  setState({ viewLoading: true, dbError: null });
  try {
    const rows = await sb.get('categories');
    setState({ viewRows: rows, viewLoading: false });
  } catch(e) { setState({ viewLoading: false, dbError: e.message }); }
}

async function saveCategory() {
  const f = S.catForm;
  const errs = {};
  if (!f.name.trim())     errs.name     = 'Required';
  if (!f.code.trim())     errs.code     = 'Required';
  if (!f.category.trim()) errs.category = 'Required';
  if (Object.keys(errs).length) { setState({ catErrors: errs }); return; }
  setState({ catSaving: true, catErrors: {} });
  try {
    const [row] = await sb.post('categories', { name: f.name.trim(), code: f.code.trim().toUpperCase(), category: f.category.trim(), active: true });
    setState(s => ({ viewRows: [row,...s.viewRows], catSaving: false, catSaved: true, catForm: { name:'', code:'', category:'' } }));
    setTimeout(() => setState({ catSaved: false, addModal: null }), 1400);
  } catch(e) { setState({ catSaving: false, dbError: e.message }); }
}

async function toggleActive(id, current) {
  try {
    await sb.patch('categories', id, { active: !current });
    setState(s => ({ viewRows: s.viewRows.map(r => r.id===id ? {...r, active: !current} : r) }));
  } catch(e) { setState({ dbError: e.message }); }
}

async function deleteCategory(id) {
  try {
    await sb.del('categories', id);
    setState(s => ({ viewRows: s.viewRows.filter(r => r.id!==id), confirmDelete: null }));
  } catch(e) { setState({ dbError: e.message, confirmDelete: null }); }
}

async function saveProduct() {
  const f = S.prodForm;
  const errs = {};
  if (!f.name.trim())     errs.name     = 'Required';
  if (!f.category.trim()) errs.category = 'Required';
  if (!f.cost)            errs.cost     = 'Required';
  if (Object.keys(errs).length) { setState({ prodErrors: errs }); return; }
  setState({ prodSaving: true, prodErrors: {} });
  try {
    await sb.post('products', {
      name: f.name.trim(), category: f.category.trim(), size: f.size,
      cost: parseFloat(f.cost)||0, discount: parseFloat(f.discount)||0,
      label_price: parseFloat(f.labelPrice)||0, stock: parseInt(f.stock)||0,
      barcode: f.barcode, lot_no: f.lotNo, design_no: f.designNo,
      color: f.color, supplier: f.supplier, owner: f.owner, sku: genSKU(),
    });
    setState({ prodSaving: false, prodSaved: true });
    setTimeout(() => setState({ prodSaved: false, addModal: null, prodForm: { category:'', size:'', name:'', cost:'', discount:'', labelPrice:'', stock:'', barcode:'', lotNo:'', designNo:'', color:'', supplier:'', owner:'Obello (O)' }, prodImagePreview: null }), 1400);
  } catch(e) { setState({ prodSaving: false, dbError: e.message }); }
}

          confirmDelete, dbError } = S;

    { id:'business',    label:'Today Business', icon:'business'    },
    { id:'earnings',    label:'Owner Earnings', icon:'earnings'    },
    { id:'paylater',    label:'Pay Later List', icon:'paylater'    },
  ];

  const sections = [
    { id:'supplier',    label:'Supplier',         desc:'Add new supplier and view them',                  icon:'supplier'    },

    { id:'cloths',      label:'Cloths Products',   desc:'Add new clothing items to your inventory',        icon:'cloths'      },

  const filteredView = viewRows.filter(r => {
    if (!viewSearch) return true;
    const q = viewSearch.toLowerCase();
    return (r.name||'').toLowerCase().includes(q) || (r.code||'').toLowerCase().includes(q) || (r.category||'').toLowerCase().includes(q);
  }).sort((a,b) => viewSort === 'type'
    ? (a.category||'').localeCompare(b.category||'')
    : new Date(b.created_at||0) - new Date(a.created_at||0)
  );

  const dateStr = new Date().toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' });
  const sku = (addModal === 'cloths') ? genSKU() : '';

          </div>

        <!-- Dark mode -->
        <div id="theme-toggle" style="display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:9px;cursor:pointer;background:${t.bgCard};border:1px solid ${t.border};font-size:12.5px;color:${t.textSub};transition:background .13s;">
          <div style="display:flex;align-items:center;gap:7px;">
            ${ico(mode==='dark' ? 'moon' : 'sun', 13, 1.5, t.textSub)}

        <button id="prod-clear" style="padding:10px 20px;border-radius:9px;border:1px solid ${t.border};background:transparent;color:${t.textSub};font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .13s;">
          Clear Form
        </button>
        <div style="display:flex;gap:8px;">
          <button id="close-add" style="padding:10px 20px;border-radius:9px;border:1px solid ${t.border};background:${t.bgCard};color:${t.textSub};font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;">Cancel</button>
          <button id="prod-save" style="
            padding:10px 32px;border-radius:9px;border:none;
            background:${prodSaved?t.success:t.accentBg};color:${prodSaved?'#fff':t.accentText};
            font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;
            display:flex;align-items:center;gap:8px;min-width:150px;justify-content:center;
            transition:background .25s;opacity:${prodSaving?.7:1};">
            ${prodSaved ? ico('check',14,2.5,'#fff')+'&nbsp;Product Added!' : prodSaving ? '<span style="width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .6s linear infinite;"></span>&nbsp;Saving…' : ico('add',14,2.2,t.accentText)+'&nbsp;Add Product'}
          </button>
        </div>
      </div>
    </div>
  </div>` : ''}

  <!-- ════ DELETE CONFIRM ════ -->
  ${confirmDelete ? `
  <div id="del-overlay" style="position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);">
    <div style="background:${t.bgPanel};border-radius:16px;width:340px;border:1px solid ${t.borderMid};box-shadow:${t.shadowLg};padding:28px;text-align:center;animation:slideUp .18s cubic-bezier(.3,.8,.4,1);">
      <div style="width:50px;height:50px;border-radius:13px;background:${t.dangerBg};border:1px solid ${t.danger};display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        ${ico('trash',22,1.5,t.danger)}
      </div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:${t.text};margin-bottom:8px;">Delete Category?</div>
      <div style="font-size:13px;color:${t.textSub};line-height:1.6;margin-bottom:22px;">This permanently removes the category from your database and cannot be undone.</div>
      <div style="display:flex;gap:8px;">
        <button id="del-cancel" style="flex:1;padding:10px;border-radius:9px;border:1px solid ${t.border};background:${t.bgCard};color:${t.textSub};font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;">Cancel</button>
        <button id="del-confirm" style="flex:1;padding:10px;border-radius:9px;border:none;background:${t.danger};color:#fff;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
          ${ico('trash',14,1.8,'#fff')} Delete
        </button>
      </div>
    </div>
  </div>` : ''}

  <!-- DB Error toast -->
  ${dbError ? `
  <div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:500;background:${t.danger};color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:slideUp .2s ease;">
    ${ico('warning',14,2,'#fff')} ${dbError}
    <button id="clear-err" style="background:rgba(255,255,255,.2);border:none;cursor:pointer;padding:2px 8px;border-radius:5px;color:#fff;font-size:12px;margin-left:4px;">✕</button>
  </div>` : ''}
  `;

  wire();
}

// ═══════════════════════════════════════════════════════
//  EVENT WIRING
// ═══════════════════════════════════════════════════════
function wire() {
  const t = T();

  // Theme toggle
  document.getElementById('theme-toggle')?.addEventListener('click', () => {
    setState({ mode: S.mode === 'dark' ? 'light' : 'dark' });
  });

  // Hover on section rows
  document.querySelectorAll('.section-row').forEach(row => {
    row.addEventListener('mouseenter', () => {
      row.style.background = t.bgHover;
      row.style.borderColor = t.borderMid;
    });
    row.addEventListener('mouseleave', () => {
      row.style.background = t.bgPanel;
      row.style.borderColor = t.border;
    });
  });

  // View buttons
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => { btn.style.borderColor = t.borderMid; btn.style.color = t.text; });
    btn.addEventListener('mouseleave', () => { btn.style.borderColor = t.border; btn.style.color = t.textSub; });
    btn.addEventListener('click', () => {
      const sec = btn.dataset.sec;
      if (sec === 'categories') {
        setState({ viewModal: 'categories', viewSearch: '', viewSort: 'date' });
        loadCategoryView();
      }
    });
  });

  // + Add New buttons
  document.querySelectorAll('.addnew-btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => btn.style.opacity = '0.8');
    btn.addEventListener('mouseleave', () => btn.style.opacity = '1');
    btn.addEventListener('click', () => {
      const sec = btn.dataset.sec;
      setState({ addModal: sec, catForm: { name:'', code:'', category:'' }, catErrors: {}, catSaved: false,
        prodErrors: {}, prodSaved: false });
    });
  });

  // ── VIEW MODAL events
  document.getElementById('close-view')?.addEventListener('click', () => setState({ viewModal: null }));
  document.getElementById('view-overlay')?.addEventListener('click', e => {
    if (e.target === e.currentTarget) setState({ viewModal: null });
  });

  document.getElementById('view-search')?.addEventListener('input', e => {
    S.viewSearch = e.target.value; render();
  });

  document.getElementById('sort-date')?.addEventListener('click', () => setState({ viewSort: 'date' }));
  document.getElementById('sort-type')?.addEventListener('click', () => setState({ viewSort: 'type' }));

  document.querySelectorAll('.toggle-active').forEach(btn => {
    btn.addEventListener('click', () => toggleActive(btn.dataset.id, btn.dataset.active === '1'));
  });
  document.querySelectorAll('.del-cat').forEach(btn => {
    btn.addEventListener('mouseenter', () => { btn.style.background = t.dangerBg; btn.style.borderColor = t.danger; });
    btn.addEventListener('mouseleave', () => { btn.style.background = 'transparent'; btn.style.borderColor = 'transparent'; });
    btn.addEventListener('click', () => setState({ confirmDelete: btn.dataset.id }));
  });

  // ── ADD CATEGORY MODAL events
  document.getElementById('close-add')?.addEventListener('click', () => setState({ addModal: null }));
  document.getElementById('add-overlay')?.addEventListener('click', e => {
    if (e.target === e.currentTarget) setState({ addModal: null });
  });
  document.getElementById('cat-cancel')?.addEventListener('click', () => setState({ addModal: null }));
  document.getElementById('cat-save')?.addEventListener('click', () => { if (!S.catSaving && !S.catSaved) saveCategory(); });

  // Live sync — category form
  const syncCat = (id, key, transform) => {
    const el = document.getElementById(id);
    el?.addEventListener('input', e => {
      const v = transform ? transform(e.target.value) : e.target.value;
      if (transform) e.target.value = v;
      S.catForm[key] = v;
      if (S.catErrors[key]) { S.catErrors[key] = null; render(); }
    });
  };
  syncCat('cat-name', 'name');
  syncCat('cat-code', 'code', v => v.toUpperCase());
  syncCat('cat-category', 'category');

  // ── ADD PRODUCT MODAL events
  document.getElementById('prod-clear')?.addEventListener('click', () => {
    setState({ prodForm: { category:'', size:'', name:'', cost:'', discount:'', labelPrice:'', stock:'', barcode:'', lotNo:'', designNo:'', color:'', supplier:'', owner:'Obello (O)' }, prodImagePreview: null, prodErrors: {} });
  });
  document.getElementById('prod-save')?.addEventListener('click', () => { if (!S.prodSaving && !S.prodSaved) saveProduct(); });

  // Live sync — product form (re-render for SKU live update)
  const syncProd = (id, key, rerender=false) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', e => { S.prodForm[key] = e.target.value; if(rerender) render(); else { if(S.prodErrors[key]){S.prodErrors[key]=null;render();} } });
    el.addEventListener('input', e => { S.prodForm[key] = e.target.value; if(rerender) render(); });
  };
  syncProd('prod-category', 'category', true);
  syncProd('prod-size',     'size',     true);
  syncProd('prod-name',     'name');
  syncProd('prod-cost',     'cost');
  syncProd('prod-discount', 'discount');
  syncProd('prod-label',    'labelPrice');
  syncProd('prod-stock',    'stock',    true);
  syncProd('prod-barcode',  'barcode');
  syncProd('prod-lotno',    'lotNo',    true);
  syncProd('prod-designno', 'designNo', true);
  syncProd('prod-color',    'color');
  syncProd('prod-supplier', 'supplier', true);
  syncProd('prod-owner',    'owner');

  // Image upload
  document.getElementById('img-input')?.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setState({ prodImagePreview: ev.target.result });
    reader.readAsDataURL(file);
  });

  // Delete confirm
  document.getElementById('del-cancel')?.addEventListener('click', () => setState({ confirmDelete: null }));
  document.getElementById('del-overlay')?.addEventListener('click', e => { if(e.target===e.currentTarget) setState({ confirmDelete: null }); });
  document.getElementById('del-confirm')?.addEventListener('click', () => deleteCategory(S.confirmDelete));

  // Error clear
  document.getElementById('clear-err')?.addEventListener('click', () => setState({ dbError: null }));

  // Focus first field
  if (S.addModal === 'categories' && !S.catSaving) {
    setTimeout(() => document.getElementById('cat-name')?.focus(), 60);
  }

  // Field focus styles
  ['cat-name','cat-code','cat-category','prod-name','prod-cost','prod-discount','prod-label','prod-stock','prod-barcode','prod-lotno','prod-designno','prod-color'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('focus', () => el.style.borderColor = t.borderFocus);
    el.addEventListener('blur',  () => el.style.borderColor = t.inputBorder);
  });
}

// ─── Boot
render();
</script>
</body>
</html>
